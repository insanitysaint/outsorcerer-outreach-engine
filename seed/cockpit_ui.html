const hostOf=u=>{const m=String(u||'').trim().toLowerCase().match(/^(?:https?:\/\/)?(?:www\.)?([a-z0-9][a-z0-9.-]*\.[a-z]{2,})/);return m?m[1]:''};
const dm=l=>(l.domain||hostOf(l.website)||'').toLowerCase();
const key=l=>em(l)||(dm(l)?'d:'+dm(l):'id:'+String(l.lead_id).toLowerCase());
const sentRows=()=>S.sent.filter(r=>r.email);
const sentMap=()=>{const m={};sentRows().forEach(r=>m[r.email.toLowerCase()]=r);return m};
const sentSet=()=>new Set(sentRows().map(r=>r.email.toLowerCase()));
const camps=()=>D().campaigns||[];
const camp=id=>camps().find(c=>c.id===id);
function campOf(l){const a=D().assign||{};const id=a[em(l)]||(dm(l)&&a['d:'+dm(l)]);if(id&&camp(id))return camp(id);
 const gulf=Object.keys(REG).some(k=>REG[k].test(l.location||''));return (gulf&&camp('c-gulf1'))||camp('c-core')||null}
const queue=()=>{const ss=sentSet();return S.leads.filter(l=>l.status==='approved'&&!ss.has(em(l))).sort((a,b)=>(+b.persona_score||0)-(+a.persona_score||0))};
const bars=n=>`<span class="bars"><b class="${n>=1?'on':''}"></b><b class="${n>=2?'on':''}"></b><b class="${n>=3?'on':''}"></b></span>`;
function seqChip(r,l){if(r){const n=r.follow_up_2_sent?3:r.follow_up_1_sent?2:1;const st=!!r.replied;return `<span class="chip ${st?'bad':''}" data-tip="${st?'Replied, bounced or opted out: sequence stopped':'Next email is sent 5 days after the last one'}">${bars(n)}${st?'Stopped at '+n+'/3':(n===3?'Sequence 3/3 · done':'Sequence '+n+'/3')}</span>`}if(l&&l.status==='approved')return `<span class="chip">${bars(0)}Queued · 0/3</span>`;if(l&&l.status==='review')return `<span class="chip">${bars(0)}Not started</span>`;return ''}
const STAGES=[['','No stage'],['interested','Interested'],['call','Call booked'],['proposal','Proposal sent'],['won','Won'],['lost','Lost']];
const stageOf=k=>(D().stage||{})[k]||'';
const campChip=c=>c?`<span class="chip" data-tip="Campaign: ${esc(c.name)}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name.length>18?c.name.slice(0,17)+'…':c.name)}</span>`:'';
const noteCount=k=>((D().notes.leads||{})[k]||[]).length;
const leadByKey=k=>S.leads.find(l=>key(l)===k);
/* ---------- api ---------- */
async function ck(body){const r=await fetch(API.op,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let j;try{j=await r.json()}catch(e){throw new Error('Cockpit API did not answer')}if(!j.ok)throw new Error(j.error||'Save failed');CK.doc=j.doc;return j}
async function ckSafe(body,okMsg){try{const j=await ck(body);if(okMsg)toast(okMsg);return j}catch(e){toast('Could not save: '+e.message);return null}}
async function call(qs){await fetch(API.decide+'?'+qs,{cache:'no-store',redirect:'manual'})}
async function load(quiet){try{const [a,b]=await Promise.all([fetch(API.state,{cache:'no-store'}).then(r=>r.json()),fetch(API.get,{cache:'no-store'}).then(r=>r.json())]);S=a;CK={doc:b.doc,replies:b.replies||[]};loaded=true;window._stamp=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});render()}catch(e){if(!quiet)toast('Could not load: '+e.message);window._stamp='load failed';head()}}
/* ---------- shell ---------- */
const NAV=[['dashboard','Dashboard','grid'],['pipeline','Pipeline','list'],['campaigns','Campaigns','flag'],['upload','Upload leads','upload'],['replies','Replies','mail'],['settings','Settings','gear']];
function paused(){return camps().filter(c=>c.status==='paused')}
function rail(){const b=(n,t,id,on,dot)=>`<button title="${t}" data-r="${id}" class="${on?'on':''}">${ic(n)}${dot?'<i class="dot"></i>':''}</button>`;
 $('#rail').innerHTML=NAV.map(([k,l,i])=>b(i,l,'v:'+k,V===k,k==='campaigns'&&paused().length)).join('')+'<span class="sp"></span>'+b('note','Notes panel','notes',NP.open)+b('refresh','Refresh','refresh')+b('sun','Toggle theme','theme')}
$('#rail').onclick=e=>{const b=e.target.closest('button');if(!b)return;const r=b.dataset.r;if(r==='refresh'){load()}else if(r==='theme'){const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';saveUi();render()}else if(r==='notes'){NP.open=!NP.open;saveUi();render()}else if(r.startsWith('v:'))go(r.slice(2))};

const TITLES={dashboard:['Overview','Everything the outreach engine is doing, in one place'],pipeline:['Pipeline','Review, approve and follow every lead'],campaigns:['Campaigns','Which campaign runs on which mailbox'],upload:['Upload leads','Drop a sheet, map the columns and assign a campaign'],replies:['Replies','Who answered, and what they said'],settings:['Settings','Mailboxes, goals, pause control and email copy']};
function head(){const [t,s]=TITLES[V];const p=paused();$('#head').innerHTML=`<div><h1>${t}</h1><p>${s} <span style="opacity:.7">${window._stamp?'· updated '+window._stamp:''}</span></p></div><span class="sp"></span><div class="hact">${p.length?`<span class="chip warn"><i></i>${p.length} campaign${p.length>1?'s':''} paused</span>`:'<span class="chip ok"><i></i>Sending allowed</span>'}${V==='upload'?'':`<button class="cta" id="hadd">${ic('upload')}Upload leads</button>`}</div>`;const ha=$('#hadd');if(ha)ha.onclick=()=>go('upload')}
function render(){document.body.classList.toggle('np',NP.open);rail();head();notesPanel();({dashboard:vDash,pipeline:vPipe,campaigns:vCamps,upload:vUpload,replies:vReplies,settings:vSettings})[V]($('#view'))}
/* ---------- popups & modal ---------- */
function popAt(el,html,left){const p=$('#pop');p.innerHTML=html;p.style.display='block';const r=el.getBoundingClientRect();const w=p.offsetWidth;p.style.position='fixed';p.style.top=(r.bottom+6)+'px';p.style.left=Math.max(8,left?r.left:r.right-w)+'px'}
document.addEventListener('click',e=>{const p=$('#pop');if(p.style.display!=='none'&&!p.contains(e.target)&&!e.target.closest('[data-pop]'))p.style.display='none'});
const closePop=()=>$('#pop').style.display='none';
function modal(html,onmount){const m=$('#modal');m.innerHTML=`<div class="modalbg"><div class="modal">${html}</div></div>`;m.querySelector('.modalbg').onclick=e=>{if(e.target.classList.contains('modalbg'))closeModal()};onmount&&onmount(m)}

 else{const l=lead;const st=stageOf(NP.key);const list=((d.notes.leads||{})[NP.key]||[]).slice().sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));

 np.innerHTML=`<div class="nh"><h2>Notes</h2><button class="kb" id="npx" title="Close">${ic('x')}</button></div><div class="nt"><button data-nt="global" class="${tab==='global'?'on':''}">General</button><button data-nt="lead" class="${tab==='lead'?'on':''}" ${NP.key?'':'disabled style="opacity:.4"'}>Selected lead</button></div><div class="nb">${body}</div>`;
 $('#npx').onclick=()=>{NP.open=false;saveUi();render()};
 np.querySelectorAll('[data-nt]').forEach(b=>b.onclick=()=>{NP.tab=b.dataset.nt;notesPanel()});
 const sg=$('#stg');if(sg)sg.onchange=async()=>{if(await ckSafe({op:'stage.set',key:NP.key,value:sg.value},'Stage saved')){notesPanel();render()}};
 np.querySelectorAll('[data-n]').forEach(b=>b.onclick=async()=>{const a=b.dataset.n,s=b.dataset.s,k=b.dataset.k;
  if(a==='add'){const t=$('#nt').value.trim();if(!t){toast('Write something first');return}if(await ckSafe({op:'note.add',scope:s,key:k,text:t},'Note saved')){notesPanel();if(V==='pipeline')render()}}
  else if(await ckSafe({op:'note.'+a,scope:s,key:k,id:b.dataset.id})){notesPanel();if(V==='pipeline')render()}})}
function openLeadNotes(k){NP.open=true;NP.tab='lead';NP.key=k;saveUi();render()}
/* ---------- stats ---------- */
function cstats(){const ss=sentMap(),R={};camps().forEach(c=>R[c.id]={leads:0,review:0,approved:0,queued:0,sent:0,replied:0,rejected:0});R.none={leads:0,review:0,approved:0,queued:0,sent:0,replied:0,rejected:0};
 for(const l of S.leads){const c=campOf(l),r=R[c?c.id:'none'];r.leads++;if(l.status==='review'||l.status==='approved'||l.status==='rejected')r[l.status]++;const s=ss[em(l)];if(s){r.sent++;if(s.replied)r.replied++}else if(l.status==='approved')r.queued++}return R}
/* ---------- charts ---------- */
function niceMax(m){if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;return (n<=2?2:n<=5?5:10)*p}
function sendsChart(){const rows=sentRows(),days=[];for(let i=13;i>=0;i--)days.push(addDays(today(),-i));
 const e1=days.map(d=>rows.filter(r=>r.sent_date===d).length),fu=days.map(d=>rows.filter(r=>r.follow_up_1_sent===d).length+rows.filter(r=>r.follow_up_2_sent===d).length);
 const mx=niceMax(Math.max(1,...days.map((_,i)=>e1[i]+fu[i])));const W=640,H=210,L=30,B=26,T=8,pw=W-L-6,ph=H-B-T,bw=pw/days.length;const y=v=>T+ph-v/mx*ph;
 let g='';for(let t=0;t<=4;t++){const v=mx*t/4,yy=y(v);g+=`<line class="gl" x1="${L}" x2="${W-6}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${Number.isInteger(v)?v:v.toFixed(1)}</text>`}
 days.forEach((d,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,a=e1[i],b=fu[i];let yy=y(0);
  if(a){const h=a/mx*ph;g+=`<rect x="${x}" y="${yy-h}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(--s1)"/>`;yy-=h+2}
  if(b){const h=b/mx*ph;g+=`<rect x="${x}" y="${yy-h}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(--s2)"/>`}
  g+=`<rect class="hit" x="${L+i*bw}" y="${T}" width="${bw}" height="${ph}" data-tip="${fd(d)}: ${a} first email${a===1?'':'s'}, ${b} follow-up${b===1?'':'s'}"/>`;
  if(i%2===1||i===days.length-1)g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${fd(d)}</text>`});
 const t1=e1.reduce((a,b)=>a+b,0),t2=fu.reduce((a,b)=>a+b,0);
 return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Emails sent per day, last 14 days: ${t1} first emails, ${t2} follow-ups">${g}</svg>`,legend:`<div class="legend"><span><span class="dot" style="background:var(--s1)"></span>First emails · ${t1}</span><span><span class="dot" style="background:var(--s2)"></span>Follow-ups · ${t2}</span></div>`,table:`<table class="t"><tr><th>Day</th><th class="n">First emails</th><th class="n">Follow-ups</th></tr>${days.map((d,i)=>`<tr><td>${fd(d)}</td><td class="n">${e1[i]}</td><td class="n">${fu[i]}</td></tr>`).join('')}</table>`}}
function hbars(items,color){const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="hb"><span class="lb" title="${esc(i.l)}">${esc(i.l)}</span><div class="tr"><div class="fi" style="width:${Math.max(i.v/mx*100,i.v?2:0)}%;background:${i.c||color||'var(--s1)'}" data-tip="${esc(i.l)}: ${i.v}"></div></div><span class="v">${i.v}</span></div>`).join('')}
function chartCard(id,title,sub,c){return `<div class="panel"><div class="ph"><h2>${title}</h2><span class="sub">${sub}</span><span class="sp"></span><button class="btn" data-tbl="${id}">Table</button></div>${c.legend}<div data-v="${id}c">${c.svg}</div><div data-v="${id}t" style="display:none">${c.table}</div></div>`}
/* ---------- dashboard ---------- */
function vDash(m){const sent=sentRows(),td=today(),rep=sent.filter(r=>r.replied).length,fu=sent.filter(r=>r.follow_up_1_sent).length+sent.filter(r=>r.follow_up_2_sent).length;
 const q=queue(),st=cstats(),d=D(),sc=sendsChart();
 const c=(l,v)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;
 const kp=`<div class="kpis">${c('Emails sent',sent.length)}${c('Sent today (UTC)',sent.filter(r=>r.sent_date===td).length)}${c('Follow-ups sent',fu)}${c('Reply rate',sent.length?Math.round(rep/sent.length*100)+'<small>%</small>':'--')}${c('In queue',q.length)}${c('Awaiting review',S.leads.filter(l=>l.status==='review').length)}</div>`;
 const bk=[...S.leads.reduce((a,l)=>{if(l.status==='review')a.set(regOf(l),(a.get(regOf(l))||0)+1);return a},new Map())].sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:REGN[k],v}));
 const fun=[{l:'Leads in inbox',v:S.leads.length},{l:'Approved',v:S.leads.filter(l=>l.status==='approved'||l.status==='sent').length},{l:'Emailed',v:sent.length},{l:'Followed up',v:sent.filter(r=>r.follow_up_1_sent).length},{l:'Replied',v:rep}];
 const won=Object.values(d.stage||{}).filter(x=>x==='won').length,call=Object.values(d.stage||{}).filter(x=>x==='call').length,need=Math.ceil((d.settings.goal_mrr||5000)/(d.settings.goal_price||1500));
 const evs=[];sent.forEach(r=>{if(r.sent_date)evs.push([r.sent_date,`Email 1 to <b>${esc(r.company)}</b>`]);if(r.follow_up_1_sent)evs.push([r.follow_up_1_sent,`Email 2 to <b>${esc(r.company)}</b>`]);if(r.follow_up_2_sent)evs.push([r.follow_up_2_sent,`Email 3 to <b>${esc(r.company)}</b>`]);if(r.replied)evs.push([r.replied_date||r.sent_date,`<b>${esc(r.company)}</b> replied (${esc(r.replied)})`])});
 evs.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));

 `<div class="grid g21">${chartCard('sc','Emails sent per day','Last 14 days',sc)}<div class="panel"><div class="ph"><h2>Pipeline funnel</h2></div>${hbars(fun,'var(--s1)')}<p class="note" style="margin-top:14px">Approved counts every lead you approved, whether or not its email has gone out yet.</p></div></div>`+
 `<div class="panel" style="margin-bottom:16px"><div class="ph"><h2>Campaigns &amp; mailboxes</h2><span class="sub">Which campaign is running on which email account</span><span class="sp"></span><button class="btn" id="goc2">Manage</button></div>${campTable(st)}</div>`+
 `<div class="grid g11"><div class="panel"><div class="ph"><h2>Next up</h2><span class="sub">Approved, waiting for their office window</span></div>${q.slice(0,6).map(l=>{const o=officeOpen(l.location);return `<div class="feed"><div><time>${l.persona_score?'Score '+esc(l.persona_score):''}</time><span style="flex:1;min-width:0"><b>${esc(l.company)}</b> <span style="color:var(--mut)">${esc(l.location)}</span></span><span class="chip ${o?'ok':''}"><i></i>${o?'Open now':'Closed'}</span></div></div>`}).join('')||'<div class="empty">Queue is empty. Approve leads in the pipeline.</div>'}</div>
 <div class="panel"><div class="ph"><h2>Goal: ${'$'+(d.settings.goal_mrr||5000).toLocaleString()} MRR</h2><span class="sub">${need} clients at ${'$'+(d.settings.goal_price||1500).toLocaleString()}+</span></div><div style="display:flex;justify-content:space-between"><span><b style="font-size:22px">${won}</b> <span style="color:var(--mut)">won of ${need}</span></span><span style="color:var(--mut)">${call} calls booked · ${rep} replies</span></div><div class="prog"><i style="width:${Math.min(100,won/need*100)}%"></i></div><p class="note">Tag a lead’s deal stage in the notes panel and this updates.</p><div class="ph" style="margin-top:14px"><h2>Recent activity</h2></div><div class="feed">${evs.slice(0,6).map(e=>`<div><time>${esc(fd(e[0]))}</time><span>${e[1]}</span></div>`).join('')||'<div style="color:var(--mut)">Nothing yet.</div>'}</div></div></div>`+
 `<div class="grid g11">${'<div class="panel"><div class="ph"><h2>Review backlog by region</h2></div>'+(hbars(bk,'var(--s1)')||'<div class="empty">No leads waiting.</div>')+'</div>'}<div class="panel"><div class="ph"><h2>Leads by campaign</h2></div>${hbars(camps().map(c=>({l:c.name,v:st[c.id].leads,c:c.color})).concat(st.none.leads?[{l:'Unassigned',v:st.none.leads,c:'var(--mut)'}]:[]))}</div></div>`;
 m.querySelectorAll('[data-tbl]').forEach(b=>b.onclick=()=>{const id=b.dataset.tbl,t=m.querySelector(`[data-v="${id}t"]`),c=m.querySelector(`[data-v="${id}c"]`),on=t.style.display==='none';t.style.display=on?'':'none';c.style.display=on?'none':'';b.textContent=on?'Chart':'Table'});
 const g=$('#goc');if(g)g.onclick=()=>go('campaigns');$('#goc2').onclick=()=>go('campaigns');bindCampBtns(m)}
function acctOf(c){return (D().accounts||[]).find(a=>a.email===c.account)}
function campTable(st){const cs=camps();if(!cs.length)return '<div class="empty">No campaigns yet.</div>';
 return `<table class="t"><tr><th>Campaign</th><th>Mailbox</th><th>Status</th><th class="n">Leads</th><th class="n">Queued</th><th class="n">Sent</th><th class="n">Replies</th><th></th></tr>${cs.map(c=>{const s=st[c.id],a=acctOf(c);const pc={active:'ok',paused:'warn',draft:''}[c.status];
 return `<tr><td><span class="dot" style="background:${esc(c.color)}"></span> <b>${esc(c.name)}</b></td><td>${esc(c.account||'No mailbox')}${a&&a.inactive?' <span class="chip">inactive slot</span>':''}</td><td><span class="chip ${pc}"><i></i>${esc(c.status)}</span></td><td class="n">${s.leads}</td><td class="n">${s.queued}</td><td class="n">${s.sent}</td><td class="n">${s.replied}</td><td style="text-align:right;white-space:nowrap">${c.status==='paused'?`<button class="btn ok" data-cb="resume" data-id="${esc(c.id)}">Resume</button>`:c.status==='active'?`<button class="btn" data-cb="pause" data-id="${esc(c.id)}">Pause</button>`:`<button class="btn" data-cb="resume" data-id="${esc(c.id)}">Activate</button>`}</td></tr>`}).join('')}</table>`}

/* ---------- soft pause: move queued leads back to review, remember them, restore on resume ---------- */
async function pauseCamp(id){const c=camp(id);if(!c)return;const ss=sentSet();const ids=S.leads.filter(l=>l.status==='approved'&&!ss.has(em(l))&&(campOf(l)||{}).id===id).map(l=>l.lead_id);let i=0;
 for(const x of ids){toast('Holding '+(++i)+' of '+ids.length+'…');await call('id='+encodeURIComponent(x)+'&d=undo')}
 await ck({op:'held.set',campaign:id,ids}).catch(()=>{});await ckSafe({op:'campaign.save',campaign:Object.assign({},c,{status:'paused'})});toast('Paused “'+c.name+'”: '+ids.length+' queued lead'+(ids.length===1?'':'s')+' held');await load()}
async function resumeCamp(id){const c=camp(id);if(!c)return;const ids=(D().held||{})[id]||[];let i=0;
 for(const x of ids){toast('Re-queuing '+(++i)+' of '+ids.length+'…');await call('id='+encodeURIComponent(x)+'&d=approve')}
 if(ids.length)await ck({op:'held.set',campaign:id,ids:[]}).catch(()=>{});await ckSafe({op:'campaign.save',campaign:Object.assign({},c,{status:'active'})});toast('“'+c.name+'” is active'+(ids.length?': '+ids.length+' lead'+(ids.length===1?'':'s')+' re-queued':''));await load()}

function parseText(text){text=String(text||'').replace(/^﻿/,'');const lines=text.split(/\r?\n/).filter(l=>l.trim());

 const first=lines[0]||'';const cnt=c=>first.split(c).length-1;const d=['\t',',',';'].sort((a,b)=>cnt(b)-cnt(a))[0];
 const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
 if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()))}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('blocked'));document.head.appendChild(s)})}
async function readFile(f){const n=f.name.toLowerCase();if(/\.(xlsx|xls|ods)$/.test(n)){if(!window.XLSX){try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}catch(e){throw new Error('Excel reader could not load. Export the sheet as CSV and drop that instead.')}}
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
 return parseText(await f.text())}
function setTable(tbl,name){tbl=tbl.filter(r=>r.some(c=>String(c).trim()));if(tbl.length<2){UP.err='Could not find a table. Include a header row and at least one lead.';UP.rows=[];render();return}
 UP.err='';UP.file=name;UP.head=tbl[0].map(x=>String(x).trim());UP.raw=tbl.slice(1);UP.map={};
 UPF.forEach(([k,,re])=>{const i=UP.head.findIndex(h=>re.test(h)&&!Object.values(UP.map).includes(UP.head.indexOf(h)));UP.map[k]=i});build();render()}
function build(){const ex=new Set(),exd=new Set();S.leads.forEach(l=>{if(em(l))ex.add(em(l));if(dm(l))exd.add(dm(l))});sentRows().forEach(r=>ex.add(r.email.toLowerCase()));
 const seenE=new Set(),seenD=new Set();const g=(r,k)=>UP.map[k]>=0?String(r[UP.map[k]]||'').replace(/[\t\r\n]+/g,' ').trim():'';
 UP.rows=UP.raw.map(r=>{const o={company:g(r,'company'),website:g(r,'website'),email:g(r,'email').toLowerCase(),location:g(r,'location'),notes:g(r,'notes')};const d=hostOf(o.website)||(o.email.includes('@')?o.email.split('@')[1]:'');o.domain=d;
  const free=/^(gmail|yahoo|hotmail|outlook|icloud|live|aol|proton|protonmail|rediffmail)\./.test(d);
  if(!o.company&&!o.website&&!o.email)o.st='empty';else if(o.email&&!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/.test(o.email))o.st='bad email';else if(!o.email&&!o.website)o.st='no email or site';
  else if((o.email&&(ex.has(o.email)||seenE.has(o.email)))||(d&&!free&&(exd.has(d)||seenD.has(d))))o.st='duplicate';else o.st=o.email?'new':'needs email lookup';
  if(o.email)seenE.add(o.email);if(d&&!free)seenD.add(d);return o})}
function vUpload(m){const ok=UP.rows.filter(r=>r.st==='new'||r.st==='needs email lookup'),dup=UP.rows.filter(r=>r.st==='duplicate').length,bad=UP.rows.length-ok.length-dup;
 m.innerHTML=`<div class="grid g21"><div><div class="drop" id="drop"><div style="font-size:15px;margin-bottom:6px"><b>Drop a sheet here</b> or <a href="#" id="pick" style="color:var(--acc)">choose a file</a></div><div>CSV, TSV, Excel (.xlsx) or a table copied from Perplexity, Gemini or Google Sheets</div><input type="file" id="fi" accept=".csv,.tsv,.txt,.xlsx,.xls,.ods" hidden></div>
 <div style="margin-top:10px"><label class="fl">…or paste a table</label><textarea class="ta" id="pt" rows="3" placeholder="Company, Website, Email, Location, Notes&#10;Acme Studio, acme.com, hello@acme.com, Dubai, White-label web"></textarea><button class="btn" id="ptg" style="margin-top:8px">Read pasted table</button></div>
 ${UP.err?`<div class="banner" style="margin-top:12px"><b>${esc(UP.err)}</b></div>`:''}
 ${UP.rows.length?`<div class="panel" style="margin-top:16px"><div class="ph"><h2>${esc(UP.file||'Pasted table')}</h2><span class="sub">${UP.rows.length} rows · ${ok.length} ready · ${dup} duplicate · ${bad} skipped</span></div>
  <div class="map">${UPF.map(([k,l])=>`<div><label class="fl">${l}</label><select class="sel" data-map="${k}" style="width:100%"><option value="-1">— none —</option>${UP.head.map((h,i)=>`<option value="${i}" ${UP.map[k]===i?'selected':''}>${esc(h||'column '+(i+1))}</option>`).join('')}</select></div>`).join('')}</div>
  <div class="pv"><table><tr><th>Status</th>${UPF.map(([,l])=>`<th>${l}</th>`).join('')}</tr>${UP.rows.slice(0,50).map(r=>`<tr class="${r.st==='new'||r.st==='needs email lookup'?'':'dup'}"><td><span class="chip ${r.st==='new'?'ok':r.st==='needs email lookup'?'info':'bad'}"><i></i>${esc(r.st)}</span></td><td>${esc(r.company)}</td><td>${esc(r.website)}</td><td>${esc(r.email)}</td><td>${esc(r.location)}</td><td>${esc(r.notes.slice(0,60))}</td></tr>`).join('')}</table></div>${UP.rows.length>50?`<p class="note" style="margin-top:8px">Showing the first 50 rows. All ${UP.rows.length} are checked.</p>`:''}</div>`:''}</div>
 <div><div class="panel"><div class="ph"><h2>Add to the engine</h2></div><label class="fl">Source</label><select class="sel" id="us" style="width:100%">${['Manual','Perplexity','Gemini','Directory'].map(s=>`<option ${UP.source===s?'selected':''}>${s}</option>`).join('')}</select><label class="fl">Assign to campaign</label><select class="sel" id="uc" style="width:100%"><option value="">Assign later</option>${camps().map(c=>`<option value="${esc(c.id)}" ${UP.camp===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <button class="btn p lg" id="ugo" style="width:100%;margin-top:16px" ${ok.length&&!UP.busy?'':'disabled'}>${UP.busy?'Adding…':ok.length?'Add '+ok.length+' lead'+(ok.length>1?'s':'')+' to the inbox':'Nothing to add yet'}</button>
  <p class="note" style="margin-top:12px">New leads land in the review list. Nothing is emailed until you approve a lead, and the engine skips anything it already has.</p>
  ${UP.res?`<div class="banner" style="margin-bottom:0"><span>${UP.res}</span></div>`:''}</div>
 <div class="panel" style="margin-top:16px"><div class="ph"><h2>Upload history</h2></div>${(D().uploads||[]).slice(0,8).map(u=>`<div class="feed"><div><time>${esc(ago(u.ts))}</time><span style="flex:1;min-width:0"><b>${esc(u.filename||'Pasted table')}</b><br><span style="color:var(--mut)">${u.added} added of ${u.rows} · ${esc(u.source||'')}${u.campaign&&camp(u.campaign)?' · '+esc(camp(u.campaign).name):''}</span></span></div></div>`).join('')||'<div style="color:var(--mut)">No uploads yet.</div>'}</div></div></div>`;
 const dr=$('#drop');['dragenter','dragover'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.add('over')}));['dragleave','drop'].forEach(ev=>dr.addEventListener(ev,e=>{e.preventDefault();dr.classList.remove('over')}));
 const take=async f=>{try{setTable(await readFile(f),f.name)}catch(e){UP.err=e.message;render()}};
 dr.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)take(f)});$('#pick').onclick=e=>{e.preventDefault();$('#fi').click()};$('#fi').onchange=e=>{if(e.target.files[0])take(e.target.files[0])};
 $('#ptg').onclick=()=>setTable(parseText($('#pt').value),'Pasted table');
 m.querySelectorAll('[data-map]').forEach(s=>s.onchange=()=>{UP.map[s.dataset.map]=+s.value;build();render()});
 $('#us').onchange=e=>UP.source=e.target.value;$('#uc').onchange=e=>UP.camp=e.target.value;$('#ugo').onclick=submitUpload}
async function submitUpload(){const ok=UP.rows.filter(r=>r.st==='new'||r.st==='needs email lookup');if(!ok.length)return;UP.busy=true;UP.res='';render();
 const text=['Company\tWebsite\tEmail\tLocation\tNotes'].concat(ok.map(r=>[r.company||r.domain,r.website,r.email,r.location,r.notes].join('\t'))).join('\n');const before=S.leads.length;
 try{const r=await fetch(API.up,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:UP.source,text})});const j=await r.json();if(!j.ok)throw new Error('The engine form answered '+j.status);
  let n=0;const dset=new Set(ok.map(x=>x.domain).filter(Boolean)),eset=new Set(ok.map(x=>x.email).filter(Boolean));let added=0;
  for(let t=0;t<7;t++){await new Promise(r=>setTimeout(r,1500));await load(true);added=S.leads.filter(l=>(em(l)&&eset.has(em(l)))||(dm(l)&&dset.has(dm(l)))).length;if(S.leads.length>before&&added>=Math.min(ok.length,1))break}
  added=S.leads.length-before>0?S.leads.length-before:added;
  const keys=[];ok.forEach(x=>{if(x.email)keys.push(x.email);if(x.domain)keys.push('d:'+x.domain)});
  if(UP.camp&&keys.length)await ck({op:'assign',emails:keys,campaign:UP.camp});
  await ck({op:'upload.log',entry:{filename:UP.file,rows:UP.rows.length,added,source:UP.source,campaign:UP.camp||null}});
  UP.res=added?`Added ${added} lead${added>1?'s':''} to the inbox${UP.camp?' and assigned them to “'+esc((camp(UP.camp)||{}).name)+'”':''}. Review them in the pipeline.`:'The engine accepted the sheet but found nothing new to add. Check the Leads tab in a moment.';
  UP.rows=[];UP.raw=[];UP.busy=false;await load(true)}catch(e){UP.busy=false;UP.res='Upload failed: '+esc(e.message);render()}}
/* ---------- settings ---------- */
const COPY={e1:{t:'Email 1 · day 0',s:'The project you had to turn down',b:"Hi {first name},\n\nIn the last 90 days, has {company} turned down a project or stretched the team past its limit?\n\nMost growing agencies have. Capacity, not clients, quietly becomes the ceiling.\n\n{OFFER from your .env file}\n\nWorth a quick call? {BOOKING_LINK}\n\n{SENDER_NAME}\n{SENDER_ROLE}, {SENDER_COMPANY}"},
 e2:{t:'Email 2 · day 5',s:'The project you had to turn down',b:"Hi {first name},\n\nFollowing up in case my note got buried.\n\nQuick context: {BRAND_NAME}'s basic services start from {STARTING_PRICE}, so you can resell at your own margin and take on the work you'd otherwise turn away. Web, UI/UX, branding, SaaS, e-commerce and ongoing maintenance, all under your name.\n\nReply \"yes\" and I'll send the rate card, or grab a time here: {BOOKING_LINK}\n\n{SENDER_NAME}\n{SENDER_ROLE}, {SENDER_COMPANY}"},
 e3:{t:'Email 3 · day 10',s:'The project you had to turn down',b:"Hi {first name},\n\nLast note from me, I promise.\n\nIf a project is slipping, a hire isn't justified yet, or there's a client you want to impress, that's exactly what we take on, quietly, under your name.\n\nIf the timing's off, just reply \"no\" and I won't write again. If it's right: {BOOKING_LINK}\n\n{SENDER_NAME}\n{SENDER_ROLE}, {SENDER_COMPANY}"}};
function vSettings(m){const d=D(),ds=d.settings||{},dr=ds.copy_drafts||{};const R=(t,s,c)=>`<div class="row"><div class="m"><div class="t">${t}</div><div class="meta"><span>${s}</span></div></div><div class="right"><span class="chip">${c}</span></div></div>`;
 m.innerHTML=`<div class="grid g11"><div class="panel"><div class="ph"><h2>Mailboxes</h2><span class="sp"></span><button class="btn" id="am">+ Add mailbox slot</button></div>${(d.accounts||[]).map(a=>`<div class="feed"><div><span style="flex:1"><b>${esc(a.email)}</b><br><span style="color:var(--mut)">${esc(a.label||'')} · ${esc(a.provider||'')} · ${a.daily_limit||0}/day cap</span><br><span style="color:var(--mut)">Campaigns: ${camps().filter(c=>c.account===a.email).map(c=>esc(c.name)).join(', ')||'none'}</span></span><span class="chip ${a.inactive?'':'ok'}"><i></i>${a.inactive?'Inactive slot':'Live'}</span></div></div>`).join('')}<p class="note" style="margin-top:12px">Only the live mailbox sends. Extra slots are placeholders until the engine is wired to another SMTP account.</p></div>
 <div class="panel"><div class="ph"><h2>Pause control</h2></div><p class="note">Pausing moves a campaign’s queued leads back to review so nothing new goes out; resuming approves them again. Follow-ups to people already emailed are scheduled by the engine and are <b>not</b> stopped by this.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn lg" id="pa" ${camps().some(c=>c.status==='active')?'':'disabled'}>${ic('pause')} Pause all active campaigns</button><button class="btn lg ok" id="ra" ${paused().length?'':'disabled'}>${ic('play')} Resume all paused</button></div>
 <div class="ph" style="margin-top:22px"><h2>Goal</h2></div><div class="form2"><div><label class="fl">Monthly revenue goal ($)</label><input class="in" id="gm" type="number" style="width:100%" value="${ds.goal_mrr||5000}"></div><div><label class="fl">Minimum per client ($)</label><input class="in" id="gp" type="number" style="width:100%" value="${ds.goal_price||1500}"></div></div><button class="btn" id="gs" style="margin-top:10px">Save goal</button></div></div>
 <div class="panel" style="margin:16px 0"><div class="ph"><h2>Live engine settings</h2><span class="sub">Read only. Starter defaults. Change them in your .env file (see the README)</span></div><div class="rows">${R('Daily send cap','2 high, 2 medium, 1 low score per day','5 / day')}${R('Office window','Each lead is emailed only while it is 09:00–11:00 in their city','Local time')}${R('Working days','Gulf: Sunday to Thursday. Everywhere else: Monday to Friday. Unknown location uses Dubai time','Per country')}${R('Sequence gap','Email 2 after 5 days, Email 3 after 5 more. A reply stops the sequence','5 + 5 days')}${R('Follow-up cap','Maximum follow-ups per day','10 / day')}</div></div>
 <div class="panel"><div class="ph"><h2>Email copy</h2><span class="sub">The {braces} are filled from your .env file when the engine sends. Edit a draft here, copy it, and paste it into the engine’s Code node if you want to change the live copy.</span></div>${['e1','e2','e3'].map(k=>{const c=COPY[k],dd=dr[k]||{};return `<div style="margin-bottom:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><b>${c.t}</b>${dd.body?'<span class="chip info"><i></i>draft saved</span>':''}<span style="flex:1"></span><button class="btn" data-cp="${k}">Copy draft</button><button class="btn" data-rs="${k}">Reset to live</button><button class="btn p" data-sv="${k}">Save draft</button></div><input class="in" id="s_${k}" style="width:100%;margin-bottom:6px" value="${esc(dd.subject!==undefined?dd.subject:c.s)}"><textarea class="ta" id="b_${k}" rows="${k==='e1'?11:9}">${esc(dd.body!==undefined?dd.body:c.b)}</textarea></div>`}).join('')}</div>
 <div class="panel" style="margin-top:16px"><div class="ph"><h2>Shortcuts</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn lg" href="/home/workflows" target="_blank" rel="noopener" style="display:inline-grid;place-items:center">Open n8n</a><a class="btn lg" href="${FORM}" target="_blank" rel="noopener" style="display:inline-grid;place-items:center">Original intake form</a><a class="btn lg" href="/webhook/lead-review" target="_blank" rel="noopener" style="display:inline-grid;place-items:center">Original review page</a></div></div>`;
 $('#am').onclick=()=>modal(`<h2>Add mailbox slot</h2><label class="fl">Email address</label><input class="in" id="ae" style="width:100%" placeholder="name@domain.com"><div class="form2"><div><label class="fl">Label</label><input class="in" id="al" style="width:100%" placeholder="Work mailbox"></div><div><label class="fl">Daily cap</label><input class="in" id="ad" type="number" style="width:100%" value="5"></div></div><p class="note" style="margin-top:12px">It is saved as an inactive slot. The engine only sends from the live mailbox.</p><div class="ma"><button class="btn lg" id="ac">Cancel</button><button class="btn p lg" id="ao">Save</button></div>`,()=>{$('#ac').onclick=closeModal;$('#ao').onclick=async()=>{if(await ckSafe({op:'account.save',account:{email:$('#ae').value.trim(),label:$('#al').value,provider:'Not connected',daily_limit:+$('#ad').value,inactive:true}},'Slot added')){closeModal();render()}}});
 $('#pa').onclick=async()=>{if(await confirmBox('Pause all active campaigns?','Pause')){for(const c of camps().filter(c=>c.status==='active'))await pauseCamp(c.id)}};
 $('#ra').onclick=async()=>{for(const c of paused())await resumeCamp(c.id)};
 $('#gs').onclick=()=>ckSafe({op:'settings.set',settings:{goal_mrr:+$('#gm').value,goal_price:+$('#gp').value}},'Goal saved');
 m.querySelectorAll('[data-sv]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sv;if(await ckSafe({op:'settings.set',settings:{copy_drafts:{[k]:{subject:$('#s_'+k).value,body:$('#b_'+k).value}}}},'Draft saved'))render()});
 m.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const k=b.dataset.rs;if(await ckSafe({op:'settings.set',settings:{copy_drafts:{[k]:null}}},'Back to live copy'))render()});
 m.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{const k=b.dataset.cp,t=$('#s_'+k).value+'\n\n'+$('#b_'+k).value;try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){toast('Select the text and copy it by hand')}})}

if(!NAV.some(n=>n[0]===V))V='dashboard';
render();load();setInterval(()=>{if(document.visibilityState==='visible'&&!document.activeElement.matches('input,textarea,select')&&!document.querySelector('.modalbg')&&!UP.busy)load(true)},60000);
