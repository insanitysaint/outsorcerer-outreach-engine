# Outreach Engine starter kit. Start with:  docker compose up -d
# Then open  http://localhost:5678/webhook/cockpit   (the cockpit)
#            http://localhost:5678                    (n8n itself, create your owner account on first visit)
name: outsorcerer-outreach-engine

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.35.7
    container_name: outreach-engine
    restart: unless-stopped
    init: true
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - .env
    environment:
      - N8N_PORT=5678
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false   # lets the engine read the settings in .env
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n-files
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false              # you are on http://localhost, not https
      - TZ=${TZ:-UTC}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    entrypoint: ["/bin/sh", "/kit/docker/start.sh"]
    volumes:
      - n8n_data:/home/node/.n8n             # n8n database + credentials
      - ./n8n-files:/home/node/.n8n-files    # your leads, sent log and cockpit data (plain files you can open)
      - ./workflows:/kit/workflows:ro
      - ./seed:/kit/seed:ro
      - ./docker:/kit/docker:ro

volumes:
  n8n_data:
